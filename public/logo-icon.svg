<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" role="img" aria-label="Du Lịch Việt Icon">
  <!-- Bánh Chưng Icon Only - Ultra Minimalist -->
  <g id="banhchung-icon-only">
    <!-- Main Square (Bánh Chưng) with rounded corners -->
    <rect x="8" y="8" width="44" height="44" rx="8" fill="#16A34A" stroke="none"/>

    <!-- Subtle Lá Dong Pattern -->
    <g opacity="0.25">
      <!-- Corner binding lines (traditional bánh chưng rope pattern) -->
      <path d="M20 20 L40 20 L40 40 L20 40 Z" stroke="#FFFFFF" stroke-width="1" fill="none" stroke-dasharray="2,2"/>
    </g>

    <!-- Center Dot (Đậu xanh accent) -->
    <circle cx="30" cy="30" r="5" fill="#F59E0B"/>

    <!-- Inner highlight for depth -->
    <circle cx="30" cy="30" r="2" fill="#FFFFFF" opacity="0.4"/>
  </g>
</svg>

