<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" role="img" aria-label="Du Lịch Việt - Vietnamese Travel Platform">
  <!-- Bánh Chưng Icon -->
  <g id="banhchung-icon">
    <!-- Main Square (Bánh Chưng) -->
    <rect x="16" y="16" width="48" height="48" rx="8" fill="#16A34A" stroke="none"/>

    <!-- Lá Dong Cultural Pattern -->
    <g opacity="0.3">
      <!-- Traditional binding pattern -->
      <rect x="24" y="24" width="32" height="32" rx="2" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
      <path d="M32 32 L48 32 M32 48 L48 48 M32 32 L32 48 M48 32 L48 48" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round"/>
    </g>

    <!-- Center Đậu xanh -->
    <circle cx="40" cy="40" r="5" fill="#F59E0B"/>
    <circle cx="40" cy="40" r="2" fill="#FFFFFF" opacity="0.5"/>
  </g>

  <!-- Text Logo - Horizontal Layout -->
  <g id="text-horizontal">
    <!-- Main Brand Name -->
    <text x="88" y="35" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#1F2937">
      Du Lịch Việt
    </text>

    <!-- AI Suffix -->
    <text x="230" y="35" font-family="Inter, sans-serif" font-size="22" font-weight="400" fill="#16A34A">
      AI
    </text>

    <!-- Tagline -->
    <text x="88" y="54" font-family="Inter, sans-serif" font-size="12" font-weight="400" fill="#64748B">
      Khám phá Việt Nam với trí tuệ nhân tạo
    </text>
  </g>

  <!-- Decorative Element (Optional) -->
  <circle cx="280" cy="28" r="2" fill="#F59E0B" opacity="0.6"/>
</svg>

