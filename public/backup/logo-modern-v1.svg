<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" role="img" aria-label="VietExplore AI - Modern Logo">
  <title>VietExplore AI</title>
  <defs>
    <!-- Modern gradient inspired by ocean and technology -->
    <linearGradient id="modernGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="50%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- AI accent gradient -->
    <linearGradient id="aiAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Modern geometric icon - stylized Vietnam map + AI neural network -->
  <g transform="translate(80,90)">
    <!-- Outer ring - representing exploration -->
    <circle cx="0" cy="0" r="35" fill="none" stroke="url(#modernGradient)" stroke-width="3" opacity="0.3"/>

    <!-- Stylized Vietnam shape with geometric cuts -->
    <path d="M-15 -25 L10 -25 L15 -15 L12 0 L18 10 L15 25 L-5 25 L-8 15 L-12 5 L-18 -5 L-15 -25Z"
          fill="url(#modernGradient)" opacity="0.9"/>

    <!-- AI neural network nodes -->
    <g opacity="0.8">
      <circle cx="-8" cy="-12" r="2.5" fill="#FFFFFF"/>
      <circle cx="5" cy="-8" r="2.5" fill="#FFFFFF"/>
      <circle cx="-3" cy="2" r="2.5" fill="#FFFFFF"/>
      <circle cx="8" cy="8" r="2.5" fill="#FFFFFF"/>
      <circle cx="-2" cy="15" r="2.5" fill="#FFFFFF"/>

      <!-- Neural connections -->
      <g stroke="#FFFFFF" stroke-width="1" opacity="0.6">
        <line x1="-8" y1="-12" x2="5" y2="-8"/>
        <line x1="5" y1="-8" x2="-3" y2="2"/>
        <line x1="-3" y1="2" x2="8" y2="8"/>
        <line x1="8" y1="8" x2="-2" y2="15"/>
        <line x1="-8" y1="-12" x2="-3" y2="2"/>
        <line x1="5" y1="-8" x2="8" y2="8"/>
      </g>
    </g>

    <!-- Central AI core -->
    <circle cx="0" cy="0" r="6" fill="url(#aiAccent)" filter="url(#glow)" opacity="0.9"/>
    <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
  </g>

  <!-- Modern typography -->
  <g transform="translate(160,110)">
    <!-- VietExplore -->
    <text x="0" y="0"
          font-family="Inter, -apple-system, system-ui, sans-serif"
          font-size="42"
          font-weight="700"
          letter-spacing="-0.02em"
          fill="url(#modernGradient)">
      VietExplore
    </text>

    <!-- AI suffix with special styling -->
    <text x="280" y="0"
          font-family="Inter, -apple-system, system-ui, sans-serif"
          font-size="42"
          font-weight="300"
          letter-spacing="0.1em"
          fill="url(#aiAccent)">
      AI
    </text>

    <!-- Tagline -->
    <text x="0" y="25"
          font-family="Inter, -apple-system, system-ui, sans-serif"
          font-size="14"
          font-weight="400"
          letter-spacing="0.05em"
          fill="#64748B"
          opacity="0.8">
      Intelligent Travel Companion
    </text>
  </g>

  <!-- Modern accent line -->
  <path d="M160 130 L480 130"
        stroke="url(#modernGradient)"
        stroke-width="2"
        opacity="0.3"/>
</svg>