<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" role="img" aria-label="Du Lịch Việt - Logo Tối Giản Bánh Chưng">
  <title>Du Lịch Việt</title>
  <defs>
    <!-- Minimal gradient for the bánh chưng -->
    <linearGradient id="banhchungGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>

    <!-- Accent color -->
    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Clean shadow -->
    <filter id="cleanShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Main logo composition -->
  <g transform="translate(80,80)">
    <!-- Minimalist bánh chưng icon -->
    <g filter="url(#cleanShadow)">
      <!-- Outer square representing lá dong (leaf wrapping) -->
      <rect x="-25" y="-25" width="50" height="50"
            fill="url(#banhchungGreen)"
            rx="4"
            stroke="#22C55E"
            stroke-width="1.5"/>

      <!-- Inner pattern representing the rice and filling -->
      <rect x="-18" y="-18" width="36" height="36"
            fill="none"
            stroke="#FFFFFF"
            stroke-width="1.5"
            rx="2"
            opacity="0.8"/>

      <!-- Central dot representing mung bean -->
      <circle cx="0" cy="0" r="4" fill="#FFFFFF" opacity="0.9"/>

      <!-- Minimal corner accent (representing the tied corners) -->
      <g stroke="#FFFFFF" stroke-width="1" opacity="0.6">
        <line x1="-20" y1="-20" x2="-15" y2="-15"/>
        <line x1="20" y1="-20" x2="15" y2="-15"/>
        <line x1="-20" y1="20" x2="-15" y2="15"/>
        <line x1="20" y1="20" x2="15" y2="15"/>
      </g>
    </g>
  </g>

  <!-- Clean, modern typography -->
  <g transform="translate(150,85)">
    <!-- Main brand name -->
    <text x="0" y="0"
          font-family="Inter, -apple-system, system-ui, sans-serif"
          font-size="38"
          font-weight="600"
          letter-spacing="-0.02em"
          fill="#1F2937">
      Du Lịch Việt
    </text>

    <!-- Clean tagline -->
    <text x="0" y="25"
          font-family="Inter, -apple-system, system-ui, sans-serif"
          font-size="14"
          font-weight="400"
          letter-spacing="0.05em"
          fill="#6B7280">
      Khám phá đất nước hình chữ S
    </text>
  </g>

  <!-- Minimal accent line -->
  <line x1="150" y1="110" x2="350" y2="110"
        stroke="url(#accentGold)"
        stroke-width="2"
        opacity="0.6"/>
</svg>