<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Du Lịch Việt - Social Media Logo">
  <title>Du Lịch Việt - Social Media</title>
  <defs>
    <!-- Social media optimized gradients -->
    <radialGradient id="socialBackground" cx="50%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="40%" stop-color="#FDE68A"/>
      <stop offset="80%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>

    <linearGradient id="socialRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>

    <linearGradient id="socialGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>

    <linearGradient id="socialTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>

    <!-- Social media shadow effect -->
    <filter id="socialShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="3" dy="6" stdDeviation="4" flood-color="#7C2D12" flood-opacity="0.4"/>
    </filter>

    <!-- Text glow for readability -->
    <filter id="socialTextGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#FEF3C7" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Square background optimized for social media -->
  <rect x="0" y="0" width="400" height="400" fill="url(#socialBackground)"/>

  <!-- Decorative border -->
  <rect x="10" y="10" width="380" height="380" fill="none" stroke="url(#socialGold)" stroke-width="4" opacity="0.7"/>
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="url(#socialRed)" stroke-width="2" opacity="0.5"/>

  <!-- Main temple complex centered -->
  <g transform="translate(200,150)" filter="url(#socialShadow)">
    <!-- Background mountains -->
    <g transform="translate(0,-50)" opacity="0.25">
      <path d="M-120 50 Q-80 20 -40 50 Q0 30 40 50 Q80 20 120 50 L120 80 L-120 80 Z" fill="url(#socialTeal)"/>
    </g>

    <!-- Central temple -->
    <g>
      <!-- Main temple body -->
      <rect x="-45" y="20" width="90" height="50" fill="url(#socialRed)" rx="4"/>

      <!-- Traditional curved roof -->
      <path d="M-60 20 Q0 -40 60 20" fill="url(#socialGold)"/>
      <path d="M-50 15 Q0 -30 50 15" fill="none" stroke="url(#socialGold)" stroke-width="3"/>

      <!-- Roof decorations -->
      <circle cx="0" cy="-25" r="6" fill="#FFFFFF"/>
      <path d="M-10 -18 L0 -32 L10 -18" fill="url(#socialGold)"/>

      <!-- Temple pillars -->
      <rect x="-35" y="20" width="6" height="50" fill="url(#socialGold)"/>
      <rect x="-15" y="20" width="6" height="50" fill="url(#socialGold)"/>
      <rect x="9" y="20" width="6" height="50" fill="url(#socialGold)"/>
      <rect x="29" y="20" width="6" height="50" fill="url(#socialGold)"/>

      <!-- Temple entrance -->
      <rect x="-20" y="35" width="40" height="35" fill="#BE123C" rx="3"/>
      <circle cx="0" cy="52" r="5" fill="url(#socialGold)"/>
    </g>

    <!-- Side lanterns -->
    <g transform="translate(-80,15)">
      <ellipse cx="0" cy="0" rx="12" ry="18" fill="url(#socialRed)" opacity="0.9"/>
      <rect x="-10" y="-12" width="20" height="24" fill="url(#socialGold)" opacity="0.7" rx="3"/>
      <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
      <path d="M0 -24 Q-4 -28 0 -32 Q4 -28 0 -24" fill="url(#socialGold)"/>
    </g>

    <g transform="translate(80,15)">
      <ellipse cx="0" cy="0" rx="12" ry="18" fill="url(#socialRed)" opacity="0.9"/>
      <rect x="-10" y="-12" width="20" height="24" fill="url(#socialGold)" opacity="0.7" rx="3"/>
      <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
      <path d="M0 -24 Q-4 -28 0 -32 Q4 -28 0 -24" fill="url(#socialGold)"/>
    </g>

    <!-- Sacred lotus pond -->
    <g transform="translate(0,55)">
      <ellipse cx="0" cy="15" rx="90" ry="15" fill="url(#socialTeal)" opacity="0.4"/>

      <!-- Multiple lotus flowers optimized for social media visibility -->
      <g transform="translate(-40,0) scale(1.1)">
        <path d="M0 -12 C5 -4, 5 4, 0 12 C-5 4, -5 -4, 0 -12Z" fill="url(#socialRed)"/>
        <path d="M-10 -4 C-12 0, -10 6, -4 10 C-6 5, -7 2, -10 -4Z" fill="url(#socialRed)"/>
        <path d="M10 -4 C12 0, 10 6, 4 10 C6 5, 7 2, 10 -4Z" fill="url(#socialRed)"/>
        <circle cx="0" cy="3" r="4" fill="#FFFFFF"/>
      </g>

      <g transform="translate(0,-5) scale(1.4)">
        <path d="M0 -12 C5 -4, 5 4, 0 12 C-5 4, -5 -4, 0 -12Z" fill="url(#socialRed)"/>
        <path d="M-10 -4 C-12 0, -10 6, -4 10 C-6 5, -7 2, -10 -4Z" fill="url(#socialRed)"/>
        <path d="M10 -4 C12 0, 10 6, 4 10 C6 5, 7 2, 10 -4Z" fill="url(#socialRed)"/>
        <circle cx="0" cy="3" r="4" fill="#FFFFFF"/>
      </g>

      <g transform="translate(40,0) scale(1.1)">
        <path d="M0 -12 C5 -4, 5 4, 0 12 C-5 4, -5 -4, 0 -12Z" fill="url(#socialRed)"/>
        <path d="M-10 -4 C-12 0, -10 6, -4 10 C-6 5, -7 2, -10 -4Z" fill="url(#socialRed)"/>
        <path d="M10 -4 C12 0, 10 6, 4 10 C6 5, 7 2, 10 -4Z" fill="url(#socialRed)"/>
        <circle cx="0" cy="3" r="4" fill="#FFFFFF"/>
      </g>

      <!-- Water ripples -->
      <ellipse cx="-25" cy="12" rx="15" ry="3" fill="none" stroke="url(#socialTeal)" stroke-width="2" opacity="0.6"/>
      <ellipse cx="30" cy="15" rx="12" ry="2.5" fill="none" stroke="url(#socialTeal)" stroke-width="2" opacity="0.6"/>
    </g>
  </g>

  <!-- Text section optimized for social media -->
  <g transform="translate(200,290)">
    <!-- Main title -->
    <text x="0" y="0"
          font-family="'Times New Roman', 'Noto Serif Vietnamese', serif"
          font-size="36"
          font-weight="700"
          font-style="italic"
          letter-spacing="0.02em"
          text-anchor="middle"
          fill="url(#socialRed)"
          filter="url(#socialTextGlow)">
      Du Lịch Việt
    </text>

    <!-- Subtitle optimized for social media -->
    <text x="0" y="30"
          font-family="'Times New Roman', 'Noto Serif Vietnamese', serif"
          font-size="16"
          font-weight="400"
          letter-spacing="0.08em"
          text-anchor="middle"
          fill="url(#socialGold)"
          opacity="0.95">
      Khám Phá Đất Nước Hình Chữ S
    </text>

    <!-- Hashtag style tagline -->
    <text x="0" y="50"
          font-family="'Times New Roman', 'Noto Serif Vietnamese', serif"
          font-size="13"
          font-weight="400"
          letter-spacing="0.05em"
          text-anchor="middle"
          fill="url(#socialTeal)"
          opacity="0.8">
      #DuLịchViệt #TravelVietnam
    </text>
  </g>

  <!-- Social media corner elements -->
  <g fill="url(#socialGold)" opacity="0.4">
    <g transform="translate(40,40)">
      <path d="M0 0 C6 -3 12 -3 18 0 C24 -2 30 3 24 6 C18 4 12 4 6 6 C0 4 -6 -2 0 0Z"/>
    </g>
    <g transform="translate(360,40)">
      <path d="M0 0 C6 -3 12 -3 18 0 C24 -2 30 3 24 6 C18 4 12 4 6 6 C0 4 -6 -2 0 0Z"/>
    </g>
    <g transform="translate(360,360)">
      <path d="M0 0 C6 -3 12 -3 18 0 C24 -2 30 3 24 6 C18 4 12 4 6 6 C0 4 -6 -2 0 0Z"/>
    </g>
    <g transform="translate(40,360)">
      <path d="M0 0 C6 -3 12 -3 18 0 C24 -2 30 3 24 6 C18 4 12 4 6 6 C0 4 -6 -2 0 0Z"/>
    </g>
  </g>

  <!-- Social media decorative elements -->
  <g stroke="url(#socialGold)" stroke-width="2" fill="none" opacity="0.5">
    <!-- Top decorative line -->
    <path d="M100 250 Q200 245 300 250"/>

    <!-- Bottom decorative line -->
    <path d="M100 340 Q200 335 300 340"/>
  </g>

  <!-- Traditional cloud motifs -->
  <g fill="url(#socialGold)" opacity="0.3">
    <g transform="translate(80,320)">
      <path d="M0 0 C5 -3 10 -3 15 0 C20 -2 25 2 20 5 C15 3 10 3 5 5 C0 3 -5 -2 0 0Z"/>
    </g>
    <g transform="translate(320,320)">
      <path d="M0 0 C5 -3 10 -3 15 0 C20 -2 25 2 20 5 C15 3 10 3 5 5 C0 3 -5 -2 0 0Z"/>
    </g>
  </g>
</svg>