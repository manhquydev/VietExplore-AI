<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 500" role="img" aria-label="Du Lịch Việt - Logo Xếp Dọc Truyền Thống">
  <title>Du Lịch Việt - Vertical</title>
  <defs>
    <!-- Traditional Vietnamese color gradients -->
    <linearGradient id="dragonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>

    <linearGradient id="lotusRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>

    <linearGradient id="oceanTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>

    <linearGradient id="skyBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Traditional shadow filter -->
    <filter id="stackedShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-color="#B45309" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background with subtle traditional pattern -->
  <rect x="0" y="0" width="350" height="500" fill="#FEF3C7" opacity="0.08"/>

  <!-- Main logo icon at top -->
  <g transform="translate(175,130)">
    <!-- Background mountains -->
    <g transform="translate(0,-40)" opacity="0.25">
      <path d="M-80 40 Q-50 15 -20 40 Q10 20 40 40 Q70 15 100 40 L100 60 L-80 60 Z" fill="url(#skyBlue)"/>
    </g>

    <!-- Traditional Vietnamese temple complex -->
    <g filter="url(#stackedShadow)">
      <!-- Central Temple -->
      <g>
        <!-- Main temple body -->
        <rect x="-35" y="20" width="70" height="40" fill="url(#lotusRed)" rx="3"/>

        <!-- Traditional curved roof -->
        <path d="M-45 20 Q0 -30 45 20" fill="url(#dragonGold)"/>
        <path d="M-40 17 Q0 -25 40 17" fill="none" stroke="url(#dragonGold)" stroke-width="2"/>

        <!-- Roof decorations -->
        <circle cx="0" cy="-20" r="5" fill="#FFFFFF"/>
        <path d="M-8 -15 L0 -25 L8 -15" fill="url(#dragonGold)"/>

        <!-- Temple pillars -->
        <rect x="-30" y="20" width="5" height="40" fill="url(#dragonGold)"/>
        <rect x="-12" y="20" width="5" height="40" fill="url(#dragonGold)"/>
        <rect x="7" y="20" width="5" height="40" fill="url(#dragonGold)"/>
        <rect x="25" y="20" width="5" height="40" fill="url(#dragonGold)"/>

        <!-- Temple entrance -->
        <rect x="-15" y="30" width="30" height="30" fill="#BE123C" rx="3"/>
        <circle cx="0" cy="45" r="4" fill="url(#dragonGold)"/>
      </g>

      <!-- Side lanterns (larger for vertical layout) -->
      <g transform="translate(-65,15)">
        <ellipse cx="0" cy="0" rx="12" ry="18" fill="url(#lotusRed)" opacity="0.9"/>
        <rect x="-10" y="-12" width="20" height="24" fill="url(#dragonGold)" opacity="0.7" rx="3"/>
        <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
        <path d="M0 -22 Q-4 -26 0 -30 Q4 -26 0 -22" fill="url(#dragonGold)"/>
      </g>

      <g transform="translate(65,15)">
        <ellipse cx="0" cy="0" rx="12" ry="18" fill="url(#lotusRed)" opacity="0.9"/>
        <rect x="-10" y="-12" width="20" height="24" fill="url(#dragonGold)" opacity="0.7" rx="3"/>
        <circle cx="0" cy="0" r="5" fill="#FFFFFF"/>
        <path d="M0 -22 Q-4 -26 0 -30 Q4 -26 0 -22" fill="url(#dragonGold)"/>
      </g>

      <!-- Sacred lotus pond -->
      <g transform="translate(0,45)">
        <ellipse cx="0" cy="15" rx="70" ry="15" fill="url(#oceanTeal)" opacity="0.4"/>

        <!-- Multiple lotus flowers arranged in vertical layout -->
        <g transform="translate(-30,0)">
          <path d="M0 -12 C5 -4, 5 4, 0 12 C-5 4, -5 -4, 0 -12Z" fill="url(#lotusRed)"/>
          <path d="M-10 -4 C-12 0, -10 6, -4 10 C-6 5, -7 2, -10 -4Z" fill="url(#lotusRed)"/>
          <path d="M10 -4 C12 0, 10 6, 4 10 C6 5, 7 2, 10 -4Z" fill="url(#lotusRed)"/>
          <circle cx="0" cy="3" r="4" fill="#FFFFFF"/>
        </g>

        <g transform="translate(0,-3) scale(1.3)">
          <path d="M0 -12 C5 -4, 5 4, 0 12 C-5 4, -5 -4, 0 -12Z" fill="url(#lotusRed)"/>
          <path d="M-10 -4 C-12 0, -10 6, -4 10 C-6 5, -7 2, -10 -4Z" fill="url(#lotusRed)"/>
          <path d="M10 -4 C12 0, 10 6, 4 10 C6 5, 7 2, 10 -4Z" fill="url(#lotusRed)"/>
          <circle cx="0" cy="3" r="4" fill="#FFFFFF"/>
        </g>

        <g transform="translate(30,0) scale(1.1)">
          <path d="M0 -12 C5 -4, 5 4, 0 12 C-5 4, -5 -4, 0 -12Z" fill="url(#lotusRed)"/>
          <path d="M-10 -4 C-12 0, -10 6, -4 10 C-6 5, -7 2, -10 -4Z" fill="url(#lotusRed)"/>
          <path d="M10 -4 C12 0, 10 6, 4 10 C6 5, 7 2, 10 -4Z" fill="url(#lotusRed)"/>
          <circle cx="0" cy="3" r="4" fill="#FFFFFF"/>
        </g>

        <!-- Water ripples -->
        <ellipse cx="-20" cy="12" rx="12" ry="3" fill="none" stroke="url(#oceanTeal)" stroke-width="1" opacity="0.5"/>
        <ellipse cx="25" cy="15" rx="10" ry="2.5" fill="none" stroke="url(#oceanTeal)" stroke-width="1" opacity="0.5"/>
      </g>
    </g>
  </g>

  <!-- Text section positioned below the icon -->
  <g transform="translate(175,320)">
    <!-- Main title -->
    <text x="0" y="0"
          font-family="'Times New Roman', 'Noto Serif Vietnamese', serif"
          font-size="42"
          font-weight="700"
          font-style="italic"
          letter-spacing="0.02em"
          text-anchor="middle"
          fill="url(#lotusRed)"
          filter="url(#stackedShadow)">
      Du Lịch Việt
    </text>

    <!-- First subtitle -->
    <text x="0" y="35"
          font-family="'Times New Roman', 'Noto Serif Vietnamese', serif"
          font-size="16"
          font-weight="400"
          letter-spacing="0.08em"
          text-anchor="middle"
          fill="url(#dragonGold)"
          opacity="0.95">
      Khám Phá Đất Nước
    </text>

    <!-- Second subtitle -->
    <text x="0" y="55"
          font-family="'Times New Roman', 'Noto Serif Vietnamese', serif"
          font-size="16"
          font-weight="400"
          letter-spacing="0.08em"
          text-anchor="middle"
          fill="url(#dragonGold)"
          opacity="0.95">
      Hình Chữ S
    </text>

    <!-- Third line - tagline -->
    <text x="0" y="80"
          font-family="'Times New Roman', 'Noto Serif Vietnamese', serif"
          font-size="13"
          font-weight="300"
          letter-spacing="0.05em"
          text-anchor="middle"
          fill="url(#oceanTeal)"
          opacity="0.8">
      Nền tảng du lịch đáng tin cậy
    </text>
  </g>

  <!-- Decorative elements for vertical layout -->
  <g stroke="url(#dragonGold)" stroke-width="2" fill="none" opacity="0.6">
    <!-- Top decorative line -->
    <path d="M100 250 Q175 245 250 250" stroke-width="2"/>

    <!-- Bottom decorative line -->
    <path d="M100 440 Q175 435 250 440" stroke-width="2"/>

    <!-- Side decorative elements -->
    <g transform="translate(50,350)">
      <path d="M0 0 C6 -4 12 -4 18 0 C24 -2 30 3 24 6 C18 4 12 4 6 6 C0 4 -6 -2 0 0Z" fill="url(#dragonGold)" opacity="0.4"/>
    </g>

    <g transform="translate(280,350)">
      <path d="M0 0 C6 -4 12 -4 18 0 C24 -2 30 3 24 6 C18 4 12 4 6 6 C0 4 -6 -2 0 0Z" fill="url(#dragonGold)" opacity="0.4"/>
    </g>
  </g>

  <!-- Corner decorations -->
  <g stroke="url(#dragonGold)" stroke-width="1.5" fill="none" opacity="0.5">
    <path d="M20 30 L40 30 M20 30 L20 50"/>
    <path d="M310 30 L330 30 M330 30 L330 50"/>
    <path d="M20 470 L40 470 M20 470 L20 450"/>
    <path d="M310 470 L330 470 M330 470 L330 450"/>
  </g>
</svg>