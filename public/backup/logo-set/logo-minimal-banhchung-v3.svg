<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" role="img" aria-label="Du Lịch Việt - Ultra Minimal Logo">
  <title>Du Lịch Việt</title>
  <defs>
    <!-- Ultra clean gradients -->
    <linearGradient id="cleanGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Subtle shadow for depth -->
    <filter id="ultraShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Main logo composition -->
  <g transform="translate(60,60)">
    <!-- Ultra minimalist bánh chưng icon -->
    <g filter="url(#ultraShadow)">
      <!-- Single clean square representing bánh chưng -->
      <rect x="-20" y="-20" width="40" height="40"
            fill="url(#cleanGreen)"
            rx="8"/>

      <!-- Minimal inner indication -->
      <rect x="-14" y="-14" width="28" height="28"
            fill="none"
            stroke="#FFFFFF"
            stroke-width="2"
            rx="4"
            opacity="0.7"/>

      <!-- Single center dot -->
      <circle cx="0" cy="0" r="3" fill="#FFFFFF" opacity="0.9"/>
    </g>
  </g>

  <!-- Ultra clean typography (Google/Microsoft style) -->
  <g transform="translate(120,68)">
    <!-- Main brand name - clean sans-serif -->
    <text x="0" y="0"
          font-family="'SF Pro Display', -apple-system, system-ui, sans-serif"
          font-size="32"
          font-weight="600"
          letter-spacing="-0.015em"
          fill="#1F2937">
      Du Lịch Việt
    </text>

    <!-- Minimal tagline -->
    <text x="0" y="20"
          font-family="'SF Pro Display', -apple-system, system-ui, sans-serif"
          font-size="11"
          font-weight="400"
          letter-spacing="0.08em"
          fill="#6B7280"
          text-transform="uppercase">
      Travel Vietnam
    </text>
  </g>
</svg>