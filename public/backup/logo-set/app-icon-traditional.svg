<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Du Lịch Việt - App Icon">
  <title>Du Lịch Việt App Icon</title>
  <defs>
    <!-- App icon gradients -->
    <radialGradient id="appBackground" cx="50%" cy="30%" r="90%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="40%" stop-color="#FDE68A"/>
      <stop offset="80%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>

    <linearGradient id="appRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>

    <linearGradient id="appGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>

    <linearGradient id="appTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>

    <!-- App icon shadow effect -->
    <filter id="appShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#7C2D12" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Rounded rectangle background (iOS style) -->
  <rect x="0" y="0" width="512" height="512" rx="115" ry="115" fill="url(#appBackground)" filter="url(#appShadow)"/>

  <!-- Border decoration -->
  <rect x="10" y="10" width="492" height="492" rx="105" ry="105" fill="none" stroke="url(#appGold)" stroke-width="8" opacity="0.6"/>

  <!-- Main temple complex -->
  <g transform="translate(256,256)">
    <!-- Background mountains -->
    <g transform="translate(0,-80)" opacity="0.3">
      <path d="M-150 60 Q-100 20 -50 60 Q0 30 50 60 Q100 20 150 60 L150 100 L-150 100 Z" fill="url(#appTeal)"/>
    </g>

    <!-- Central temple -->
    <g filter="url(#appShadow)" opacity="0.95">
      <!-- Main temple body -->
      <rect x="-60" y="30" width="120" height="60" fill="url(#appRed)" rx="6"/>

      <!-- Traditional curved roof -->
      <path d="M-80 30 Q0 -50 80 30" fill="url(#appGold)"/>
      <path d="M-70 25 Q0 -40 70 25" fill="none" stroke="url(#appGold)" stroke-width="4"/>

      <!-- Roof decorations -->
      <circle cx="0" cy="-30" r="8" fill="#FFFFFF"/>
      <path d="M-12 -22 L0 -38 L12 -22" fill="url(#appGold)"/>

      <!-- Temple pillars -->
      <rect x="-50" y="30" width="8" height="60" fill="url(#appGold)"/>
      <rect x="-20" y="30" width="8" height="60" fill="url(#appGold)"/>
      <rect x="12" y="30" width="8" height="60" fill="url(#appGold)"/>
      <rect x="42" y="30" width="8" height="60" fill="url(#appGold)"/>

      <!-- Temple entrance -->
      <rect x="-25" y="45" width="50" height="45" fill="#BE123C" rx="4"/>
      <circle cx="0" cy="67" r="6" fill="url(#appGold)"/>
    </g>

    <!-- Side lanterns -->
    <g transform="translate(-100,20)" filter="url(#appShadow)">
      <ellipse cx="0" cy="0" rx="15" ry="22" fill="url(#appRed)" opacity="0.9"/>
      <rect x="-12" y="-15" width="24" height="30" fill="url(#appGold)" opacity="0.7" rx="4"/>
      <circle cx="0" cy="0" r="6" fill="#FFFFFF"/>
      <path d="M0 -28 Q-5 -35 0 -40 Q5 -35 0 -28" fill="url(#appGold)"/>
    </g>

    <g transform="translate(100,20)" filter="url(#appShadow)">
      <ellipse cx="0" cy="0" rx="15" ry="22" fill="url(#appRed)" opacity="0.9"/>
      <rect x="-12" y="-15" width="24" height="30" fill="url(#appGold)" opacity="0.7" rx="4"/>
      <circle cx="0" cy="0" r="6" fill="#FFFFFF"/>
      <path d="M0 -28 Q-5 -35 0 -40 Q5 -35 0 -28" fill="url(#appGold)"/>
    </g>

    <!-- Sacred lotus pond -->
    <g transform="translate(0,70)">
      <ellipse cx="0" cy="20" rx="120" ry="20" fill="url(#appTeal)" opacity="0.4"/>

      <!-- Multiple lotus flowers -->
      <g transform="translate(-50,0) scale(1.2)">
        <path d="M0 -15 C6 -5, 6 5, 0 15 C-6 5, -6 -5, 0 -15Z" fill="url(#appRed)"/>
        <path d="M-12 -5 C-15 0, -12 8, -5 12 C-7 6, -9 2, -12 -5Z" fill="url(#appRed)"/>
        <path d="M12 -5 C15 0, 12 8, 5 12 C7 6, 9 2, 12 -5Z" fill="url(#appRed)"/>
        <circle cx="0" cy="4" r="5" fill="#FFFFFF"/>
      </g>

      <g transform="translate(0,-8) scale(1.5)">
        <path d="M0 -15 C6 -5, 6 5, 0 15 C-6 5, -6 -5, 0 -15Z" fill="url(#appRed)"/>
        <path d="M-12 -5 C-15 0, -12 8, -5 12 C-7 6, -9 2, -12 -5Z" fill="url(#appRed)"/>
        <path d="M12 -5 C15 0, 12 8, 5 12 C7 6, 9 2, 12 -5Z" fill="url(#appRed)"/>
        <circle cx="0" cy="4" r="5" fill="#FFFFFF"/>
      </g>

      <g transform="translate(50,0) scale(1.2)">
        <path d="M0 -15 C6 -5, 6 5, 0 15 C-6 5, -6 -5, 0 -15Z" fill="url(#appRed)"/>
        <path d="M-12 -5 C-15 0, -12 8, -5 12 C-7 6, -9 2, -12 -5Z" fill="url(#appRed)"/>
        <path d="M12 -5 C15 0, 12 8, 5 12 C7 6, 9 2, 12 -5Z" fill="url(#appRed)"/>
        <circle cx="0" cy="4" r="5" fill="#FFFFFF"/>
      </g>

      <!-- Water ripples -->
      <ellipse cx="-30" cy="15" rx="20" ry="5" fill="none" stroke="url(#appTeal)" stroke-width="2" opacity="0.6"/>
      <ellipse cx="40" cy="18" rx="15" ry="4" fill="none" stroke="url(#appTeal)" stroke-width="2" opacity="0.6"/>
    </g>

    <!-- Subtle monogram "DLV" at bottom -->
    <g transform="translate(0,120)" opacity="0.4">
      <text x="0" y="0"
            font-family="'Times New Roman', serif"
            font-size="24"
            font-weight="700"
            text-anchor="middle"
            fill="url(#appGold)">
        DLV
      </text>
    </g>
  </g>

  <!-- Corner decorative elements -->
  <g fill="url(#appGold)" opacity="0.3">
    <g transform="translate(60,60)">
      <path d="M0 0 C8 -4 16 -4 24 0 C32 -2 40 4 32 8 C24 4 16 4 8 8 C0 4 -8 -2 0 0Z"/>
    </g>
    <g transform="translate(452,60)">
      <path d="M0 0 C8 -4 16 -4 24 0 C32 -2 40 4 32 8 C24 4 16 4 8 8 C0 4 -8 -2 0 0Z"/>
    </g>
    <g transform="translate(452,452)">
      <path d="M0 0 C8 -4 16 -4 24 0 C32 -2 40 4 32 8 C24 4 16 4 8 8 C0 4 -8 -2 0 0Z"/>
    </g>
    <g transform="translate(60,452)">
      <path d="M0 0 C8 -4 16 -4 24 0 C32 -2 40 4 32 8 C24 4 16 4 8 8 C0 4 -8 -2 0 0Z"/>
    </g>
  </g>

  <!-- Highlight effect (iOS style) -->
  <rect x="10" y="10" width="492" height="200" rx="105" ry="105" fill="url(#appGold)" opacity="0.15"/>
</svg>