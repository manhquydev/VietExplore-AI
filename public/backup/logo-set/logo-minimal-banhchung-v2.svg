<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" role="img" aria-label="Du Lịch Việt - Logo Bánh Chưng Pattern">
  <title>Du Lịch Việt</title>
  <defs>
    <!-- Bánh chưng pattern gradient -->
    <linearGradient id="leafGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>

    <!-- Rice pattern -->
    <linearGradient id="riceWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F9FAFB"/>
    </linearGradient>

    <!-- Vietnamese lá dong pattern -->
    <pattern id="dongPattern" patternUnits="userSpaceOnUse" width="8" height="8">
      <rect width="8" height="8" fill="#059669"/>
      <path d="M0 4 Q4 0 8 4 Q4 8 0 4Z" fill="#047857" opacity="0.3"/>
    </pattern>

    <!-- Clean professional shadow -->
    <filter id="modernShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Main logo composition -->
  <g transform="translate(80,80)">
    <!-- Refined bánh chưng icon with cultural pattern -->
    <g filter="url(#modernShadow)">
      <!-- Main square representing bánh chưng -->
      <rect x="-28" y="-28" width="56" height="56"
            fill="url(#leafGreen)"
            rx="6"/>

      <!-- Traditional pattern overlay (subtle) -->
      <rect x="-26" y="-26" width="52" height="52"
            fill="url(#dongPattern)"
            rx="4"
            opacity="0.2"/>

      <!-- Inner rice square -->
      <rect x="-20" y="-20" width="40" height="40"
            fill="url(#riceWhite)"
            rx="3"/>

      <!-- Traditional Vietnamese knot pattern (four corners) -->
      <g fill="#059669" opacity="0.7">
        <!-- Top-left corner knot -->
        <rect x="-24" y="-24" width="8" height="8" rx="1"/>
        <circle cx="-20" cy="-20" r="2" fill="#FFFFFF"/>

        <!-- Top-right corner knot -->
        <rect x="16" y="-24" width="8" height="8" rx="1"/>
        <circle cx="20" cy="-20" r="2" fill="#FFFFFF"/>

        <!-- Bottom-left corner knot -->
        <rect x="-24" y="16" width="8" height="8" rx="1"/>
        <circle cx="-20" cy="20" r="2" fill="#FFFFFF"/>

        <!-- Bottom-right corner knot -->
        <rect x="16" y="16" width="8" height="8" rx="1"/>
        <circle cx="20" cy="20" r="2" fill="#FFFFFF"/>
      </g>

      <!-- Central mung bean representation -->
      <circle cx="0" cy="0" r="6" fill="#F59E0B" opacity="0.8"/>
      <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Modern Vietnamese typography -->
  <g transform="translate(150,85)">
    <!-- Main brand name -->
    <text x="0" y="0"
          font-family="Inter, -apple-system, system-ui, sans-serif"
          font-size="40"
          font-weight="700"
          letter-spacing="-0.025em"
          fill="#0F172A">
      Du Lịch Việt
    </text>

    <!-- Descriptive tagline -->
    <text x="0" y="26"
          font-family="Inter, -apple-system, system-ui, sans-serif"
          font-size="13"
          font-weight="500"
          letter-spacing="0.05em"
          fill="#059669"
          opacity="0.9">
      NỀN TẢNG DU LỊCH ĐÁNG TIN CẬY
    </text>
  </g>

  <!-- Minimal design accent -->
  <g opacity="0.6">
    <!-- Simple geometric accent lines -->
    <line x1="150" y1="115" x2="420" y2="115"
          stroke="#059669"
          stroke-width="2"/>

    <line x1="150" y1="120" x2="350" y2="120"
          stroke="#F59E0B"
          stroke-width="1"/>
  </g>

  <!-- Subtle pattern element -->
  <g transform="translate(520,80)" opacity="0.3">
    <rect x="-8" y="-8" width="16" height="16"
          fill="url(#leafGreen)"
          rx="2"/>
    <rect x="-6" y="-6" width="12" height="12"
          fill="#FFFFFF"
          rx="1"/>
  </g>
</svg>