<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Du Lịch Việt - Monogram Badge">
  <title>DLV Monogram</title>
  <defs>
    <!-- Traditional Vietnamese color gradients -->
    <radialGradient id="badgeBackground" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="60%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>

    <linearGradient id="dragonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>

    <linearGradient id="lotusRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>

    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="50%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Badge shadow and glow effects -->
    <filter id="badgeShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#7C2D12" flood-opacity="0.4"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#F59E0B" flood-opacity="0.3"/>
    </filter>

    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#FEF3C7" flood-opacity="0.8"/>
    </filter>

    <!-- Traditional Vietnamese pattern -->
    <pattern id="vietPattern" patternUnits="userSpaceOnUse" width="24" height="24">
      <rect width="24" height="24" fill="#DC2626" opacity="0.1"/>
      <circle cx="12" cy="12" r="4" fill="#F59E0B" opacity="0.2"/>
      <path d="M6 12 L12 6 L18 12 L12 18 Z" fill="#BE123C" opacity="0.15"/>
    </pattern>
  </defs>

  <!-- Outer decorative ring -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#dragonGold)" stroke-width="4" opacity="0.8"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="url(#lotusRed)" stroke-width="2" opacity="0.6"/>

  <!-- Main badge background -->
  <circle cx="100" cy="100" r="80" fill="url(#badgeBackground)" filter="url(#badgeShadow)"/>

  <!-- Traditional pattern overlay -->
  <circle cx="100" cy="100" r="75" fill="url(#vietPattern)" opacity="0.3"/>

  <!-- Inner decorative elements -->
  <circle cx="100" cy="100" r="65" fill="none" stroke="url(#goldText)" stroke-width="1" stroke-dasharray="8,4" opacity="0.7"/>

  <!-- Central monogram design -->
  <g transform="translate(100,100)">
    <!-- Traditional Vietnamese temple silhouette (simplified) -->
    <g transform="translate(0,-25) scale(0.8)" opacity="0.4">
      <!-- Simplified temple roof -->
      <path d="M-20 0 Q0 -15 20 0" fill="url(#lotusRed)"/>
      <rect x="-15" y="0" width="30" height="15" fill="url(#lotusRed)"/>

      <!-- Temple pillars -->
      <rect x="-12" y="0" width="2" height="15" fill="url(#dragonGold)"/>
      <rect x="-4" y="0" width="2" height="15" fill="url(#dragonGold)"/>
      <rect x="2" y="0" width="2" height="15" fill="url(#dragonGold)"/>
      <rect x="10" y="0" width="2" height="15" fill="url(#dragonGold)"/>
    </g>

    <!-- Main monogram letters "DLV" -->
    <g>
      <!-- Letter D -->
      <g transform="translate(-30,0)">
        <text x="0" y="8"
              font-family="'Times New Roman', 'Noto Serif Vietnamese', serif"
              font-size="32"
              font-weight="700"
              text-anchor="middle"
              fill="url(#lotusRed)"
              filter="url(#textGlow)">
          D
        </text>
      </g>

      <!-- Letter L (center, slightly larger) -->
      <g transform="translate(0,0)">
        <text x="0" y="8"
              font-family="'Times New Roman', 'Noto Serif Vietnamese', serif"
              font-size="36"
              font-weight="700"
              text-anchor="middle"
              fill="url(#lotusRed)"
              filter="url(#textGlow)">
          L
        </text>
      </g>

      <!-- Letter V -->
      <g transform="translate(30,0)">
        <text x="0" y="8"
              font-family="'Times New Roman', 'Noto Serif Vietnamese', serif"
              font-size="32"
              font-weight="700"
              text-anchor="middle"
              fill="url(#lotusRed)"
              filter="url(#textGlow)">
          V
        </text>
      </g>
    </g>

    <!-- Decorative elements around the letters -->
    <g opacity="0.6">
      <!-- Small lotus petals around letters -->
      <g transform="translate(-45,-8) scale(0.3)">
        <path d="M0 -8 C3 -2, 3 2, 0 8 C-3 2, -3 -2, 0 -8Z" fill="url(#dragonGold)"/>
      </g>

      <g transform="translate(45,-8) scale(0.3)">
        <path d="M0 -8 C3 -2, 3 2, 0 8 C-3 2, -3 -2, 0 -8Z" fill="url(#dragonGold)"/>
      </g>

      <g transform="translate(-45,20) scale(0.3)">
        <path d="M0 -8 C3 -2, 3 2, 0 8 C-3 2, -3 -2, 0 -8Z" fill="url(#dragonGold)"/>
      </g>

      <g transform="translate(45,20) scale(0.3)">
        <path d="M0 -8 C3 -2, 3 2, 0 8 C-3 2, -3 -2, 0 -8Z" fill="url(#dragonGold)"/>
      </g>
    </g>

    <!-- Central decorative dot -->
    <circle cx="0" cy="25" r="3" fill="url(#goldText)" opacity="0.8"/>

    <!-- Traditional underline decoration -->
    <path d="M-35 30 Q0 25 35 30"
          fill="none"
          stroke="url(#dragonGold)"
          stroke-width="2"
          opacity="0.7"/>
  </g>

  <!-- Bottom text around the circle -->
  <g>
    <!-- Curved text path for "DU LỊCH VIỆT" -->
    <defs>
      <path id="circleText" d="M 100,100 m -60,0 a 60,60 0 1,1 120,0 a 60,60 0 1,1 -120,0"/>
    </defs>

    <text font-family="'Times New Roman', serif"
          font-size="14"
          font-weight="600"
          fill="url(#goldText)"
          opacity="0.9">
      <textPath href="#circleText" startOffset="25%">
        DU LỊCH VIỆT • TRAVEL VIETNAM
      </textPath>
    </text>
  </g>

  <!-- Traditional corner decorations -->
  <g fill="url(#dragonGold)" opacity="0.4">
    <g transform="translate(40,40)">
      <path d="M0 0 C4 -2 8 -2 12 0 C16 -1 20 2 16 4 C12 2 8 2 4 4 C0 2 -4 -1 0 0Z"/>
    </g>
    <g transform="translate(160,40)">
      <path d="M0 0 C4 -2 8 -2 12 0 C16 -1 20 2 16 4 C12 2 8 2 4 4 C0 2 -4 -1 0 0Z"/>
    </g>
    <g transform="translate(160,160)">
      <path d="M0 0 C4 -2 8 -2 12 0 C16 -1 20 2 16 4 C12 2 8 2 4 4 C0 2 -4 -1 0 0Z"/>
    </g>
    <g transform="translate(40,160)">
      <path d="M0 0 C4 -2 8 -2 12 0 C16 -1 20 2 16 4 C12 2 8 2 4 4 C0 2 -4 -1 0 0Z"/>
    </g>
  </g>
</svg>