<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-label="Du Lịch Việt - Traditional Vietnamese Logo">
  <title>Du Lịch Việt</title>
  <defs>
    <!-- Traditional Vietnamese color gradients -->
    <linearGradient id="dragonGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#CA8A04"/>
    </linearGradient>

    <linearGradient id="lotusRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="50%" stop-color="#E11D48"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>

    <linearGradient id="oceanTeal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#0D9488"/>
    </linearGradient>

    <!-- Traditional pattern -->
    <pattern id="traditionalPattern" patternUnits="userSpaceOnUse" width="20" height="20">
      <rect width="20" height="20" fill="#FEF3C7" opacity="0.1"/>
      <circle cx="10" cy="10" r="2" fill="#F59E0B" opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Traditional decorative border -->
  <rect x="20" y="20" width="680" height="160" fill="none" stroke="url(#dragonGold)" stroke-width="2" rx="10" opacity="0.3"/>

  <!-- Main logo composition -->
  <g transform="translate(100,100)">
    <!-- Traditional Vietnamese architectural element - inspired by Temple of Literature -->
    <g>
      <!-- Base temple structure -->
      <rect x="-25" y="10" width="50" height="30" fill="url(#lotusRed)" rx="2"/>
      <polygon points="-30,10 0,-15 30,10" fill="url(#dragonGold)"/>

      <!-- Traditional roof details -->
      <path d="M-28 8 Q0 -18 28 8" fill="none" stroke="url(#dragonGold)" stroke-width="2"/>
      <circle cx="0" cy="-8" r="3" fill="#FFFFFF"/>

      <!-- Vietnamese lantern elements -->
      <g transform="translate(-40,0)">
        <ellipse cx="0" cy="0" rx="8" ry="12" fill="url(#lotusRed)" opacity="0.8"/>
        <rect x="-6" y="-8" width="12" height="16" fill="url(#dragonGold)" opacity="0.6"/>
        <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
      </g>

      <g transform="translate(40,0)">
        <ellipse cx="0" cy="0" rx="8" ry="12" fill="url(#lotusRed)" opacity="0.8"/>
        <rect x="-6" y="-8" width="12" height="16" fill="url(#dragonGold)" opacity="0.6"/>
        <circle cx="0" cy="0" r="3" fill="#FFFFFF"/>
      </g>
    </g>

    <!-- Sacred lotus pond -->
    <g transform="translate(0,25)">
      <ellipse cx="0" cy="8" rx="45" ry="8" fill="url(#oceanTeal)" opacity="0.3"/>

      <!-- Lotus flowers -->
      <g transform="translate(-15,0)">
        <path d="M0 -8 C3 -2, 3 2, 0 8 C-3 2, -3 -2, 0 -8Z" fill="url(#lotusRed)"/>
        <path d="M-6 -2 C-8 0, -6 4, -2 6 C-3 3, -4 1, -6 -2Z" fill="url(#lotusRed)"/>
        <path d="M6 -2 C8 0, 6 4, 2 6 C3 3, 4 1, 6 -2Z" fill="url(#lotusRed)"/>
        <circle cx="0" cy="2" r="2" fill="#FFFFFF"/>
      </g>

      <g transform="translate(15,0) scale(0.8)">
        <path d="M0 -8 C3 -2, 3 2, 0 8 C-3 2, -3 -2, 0 -8Z" fill="url(#lotusRed)"/>
        <path d="M-6 -2 C-8 0, -6 4, -2 6 C-3 3, -4 1, -6 -2Z" fill="url(#lotusRed)"/>
        <path d="M6 -2 C8 0, 6 4, 2 6 C3 3, 4 1, 6 -2Z" fill="url(#lotusRed)"/>
        <circle cx="0" cy="2" r="2" fill="#FFFFFF"/>
      </g>
    </g>
  </g>

  <!-- Traditional Vietnamese calligraphy-inspired text -->
  <g transform="translate(220,120)">
    <!-- "Du Lịch Việt" in traditional style -->
    <text x="0" y="0"
          font-family="'Times New Roman', 'Noto Serif Vietnamese', serif"
          font-size="52"
          font-weight="700"
          font-style="italic"
          letter-spacing="0.05em"
          fill="url(#lotusRed)">
      Du Lịch Việt
    </text>

    <!-- Traditional subtitle -->
    <text x="0" y="30"
          font-family="'Times New Roman', 'Noto Serif Vietnamese', serif"
          font-size="16"
          font-weight="400"
          letter-spacing="0.15em"
          fill="url(#dragonGold)"
          opacity="0.9">
      Khám Phá Đất Nước Hình Chữ S
    </text>

    <!-- Traditional decorative element -->
    <g transform="translate(0,45)">
      <path d="M0 0 Q50 -5 100 0 Q150 5 200 0 Q250 -3 300 0"
            fill="none"
            stroke="url(#dragonGold)"
            stroke-width="3"
            opacity="0.6"/>

      <!-- Traditional cloud motifs -->
      <g transform="translate(50,-8)">
        <path d="M0 0 C5 -3 10 -3 15 0 C20 -2 25 2 20 5 C15 3 10 3 5 5 C0 3 -5 -2 0 0Z"
              fill="url(#dragonGold)" opacity="0.4"/>
      </g>

      <g transform="translate(150,-8)">
        <path d="M0 0 C5 -3 10 -3 15 0 C20 -2 25 2 20 5 C15 3 10 3 5 5 C0 3 -5 -2 0 0Z"
              fill="url(#dragonGold)" opacity="0.4"/>
      </g>

      <g transform="translate(250,-8)">
        <path d="M0 0 C5 -3 10 -3 15 0 C20 -2 25 2 20 5 C15 3 10 3 5 5 C0 3 -5 -2 0 0Z"
              fill="url(#dragonGold)" opacity="0.4"/>
      </g>
    </g>
  </g>

  <!-- Traditional corner decorations -->
  <g transform="translate(50,50)">
    <path d="M0 0 L15 0 L15 15 M0 0 L0 15 L15 15"
          stroke="url(#dragonGold)" stroke-width="2" fill="none" opacity="0.5"/>
  </g>

  <g transform="translate(650,50)">
    <path d="M0 0 L-15 0 L-15 15 M0 0 L0 15 L-15 15"
          stroke="url(#dragonGold)" stroke-width="2" fill="none" opacity="0.5"/>
  </g>

  <g transform="translate(50,150)">
    <path d="M0 0 L15 0 L15 -15 M0 0 L0 -15 L15 -15"
          stroke="url(#dragonGold)" stroke-width="2" fill="none" opacity="0.5"/>
  </g>

  <g transform="translate(650,150)">
    <path d="M0 0 L-15 0 L-15 -15 M0 0 L0 -15 L-15 -15"
          stroke="url(#dragonGold)" stroke-width="2" fill="none" opacity="0.5"/>
  </g>
</svg>