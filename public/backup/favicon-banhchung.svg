<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Du Lịch Việt Favicon">
  <!-- Ultra Minimalist Favicon - Bánh Chưng Style -->

  <!-- Main Square (Bánh Chưng) -->
  <rect x="4" y="4" width="24" height="24" rx="4" fill="#16A34A"/>

  <!-- Center Dot (Đậu xanh) -->
